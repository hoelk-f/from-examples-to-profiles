[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "from-examples-to-profiles"
version = "1.0.0"
description = "From Examples to Profiles replication artifact"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "scipy==1.18.1"]

[project.scripts]
reproduce = "pbe_artifact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
